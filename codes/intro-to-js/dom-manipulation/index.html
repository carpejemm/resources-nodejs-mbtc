<!-- Saying to our browser that we're using HTML5 -->
<!DOCTYPE html>
<!-- Setting our language to English and defining the character encoding and viewport for responsive design. The title of the document is set to "Document". The body of the document is currently empty. -->
<!-- root tag - html tag -->
<html lang="en">
<!-- head - this is where our metadata lives -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Manipulation</title>
  <!-- We can also add our tab logo here -->
  
  <!-- Link our script file -->
  <!-- <script src="./js-files/index.js" defer></script> -->
  <script src="script.js" defer></script>
</head>
<body>
  <!-- This is where all our HTML tags will go and all visible content will be rendered here. We can also add our JavaScript code here or link to an external JavaScript file. -->

  <h1>Welcome to DOM Manipulation</h1>
  <div id="my-div">This is a div</div>
  <p id="my-paragraph-1">This is a paragraph 1</p>
  <p id="my-paragraph-2">This is a paragraph 2</p>
  <p id="my-paragraph-3">This is a paragraph 3</p>

  <div>This is another Div</div>
  <p class="paragraph">This is another paragraph</p>
  <p class="paragraph">This is another paragraph</p>
  <p class="paragraph">This is another paragraph</p>

  <img src="https://cdn.britannica.com/70/234870-050-D4D024BB/Orange-colored-cat-yawns-displaying-teeth.jpg" alt="Orange cat yawning" width="300">
  <img src="https://cdn.britannica.com/70/234870-050-D4D024BB/Orange-colored-cat-yawns-displaying-teeth.jpg" alt="Orange cat yawning" width="100">
  <img src="https://cdn.britannica.com/70/234870-050-D4D024BB/Orange-colored-cat-yawns-displaying-teeth.jpg" alt="Orange cat yawning" width="200">

  <!-- JavaScript Events -->
  <!-- But this is a bad practice, we don't want to pollute our HTML with JavaScript code. We will see how to add event listeners in JavaScript in the next section. -->
  <button onclick="alert('Button clicked!')">Click Me!!</button>

  <div class="hello-world">Hello, world!!</div>

  <button id="surprise-btn">Click me for more surprises</button>

  
  
</body>
</html>
